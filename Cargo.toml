[package]
name = "rusty_pixel_dungeon"
version = "0.1.0"
edition = "2024"

[lints.clippy]
doc_markdown = "warn"
manual_let_else = "warn"
match_same_arms = "warn"
redundant_closure_for_method_calls = "warn"
redundant_else = "warn"
semicolon_if_nothing_returned = "warn"
type_complexity = "allow"
undocumented_unsafe_blocks = "warn"
unwrap_or_default = "warn"
needless_lifetimes = "allow"
too_many_arguments = "allow"
nonstandard_macro_braces = "warn"

ptr_as_ptr = "warn"
ptr_cast_constness = "warn"
ref_as_ptr = "warn"

too_long_first_doc_paragraph = "allow"

allow_attributes = "warn"
allow_attributes_without_reason = "warn"

[lints.rust]
missing_docs = "allow"
unsafe_code = "deny"
unsafe_op_in_unsafe_fn = "warn"
unused_qualifications = "warn"

# 发布构建：最大化优化（WASM 体积优化参考 bevy-cheatbook）
[profile.release]
lto = true
opt-level = 3
codegen-units = 1
incremental = false
debug = false

[profile.dev]
opt-level = 1

[profile.dev.package."*"]
opt-level = 3

[dependencies]
# splash 图为 .jpg、音效为 .mp3（音乐 .ogg 走默认 vorbis），需显式开对应特性
bevy = { version = "0.19", features = ["jpeg", "mp3"] }
bevy_asset_loader = { version = "0.27", features = ["standard_dynamic_assets"] }
bevy_ecs_tilemap = "0.19"

thiserror = "2.0"
anyhow = "1.0"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
bitflags = "2.11"
java-properties = "2.0"

# 生成/回合逻辑的随机源统一显式传 Rng，禁止全局 random（见 docs/plans/01）
# chacha：种子确定性（跨平台/跨版本稳定），供地牢生成使用
rand = { version = "0.10", features = ["chacha"] }
num_enum = "0.7"
strum = { version = "0.28", features = ["derive"] }
